name: Tests Python

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests unitaires
        working-directory: moteur_python
        run: python -m unittest tests_unitaires -v
      - name: Recherche et chi2 (test de fumée)
        working-directory: moteur_python
        run: |
          python main.py rechercher "الشفعة" -k 3
          python main.py chi2 -n 5
